<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7C4DEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سلفتي">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>سلفتي – إدارة السلف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FB;--card:#fff;--ink:#1E1B3A;--mut:#6E6B8A;--line:#ECEAF6;
  --pri:#6C5CE7;--pri-d:#5443D6;--teal:#10B5A4;--coral:#FF6B6B;--amber:#F59E0B;
  --sky:#3B9EFF;--pink:#EC4899;--green:#22B573;--violet:#8B5CF6;--rose:#F43F5E;--gray:#94A3B8;
  --r:20px;--sh:0 6px 24px rgba(48,38,120,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding-bottom:110px;min-height:100vh;position:relative}

/* header */
.top{background:linear-gradient(135deg,#6C5CE7 0%,#9B59F0 50%,#EC4899 100%);color:#fff;padding:18px 18px 64px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.top:before,.top:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.top:before{width:180px;height:180px;top:-60px;left:-40px}
.top:after{width:120px;height:120px;bottom:-40px;right:30%;background:rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(4px)}
.brand h1{margin:0;font-size:24px;font-weight:800;line-height:1}
.brand p{margin:3px 0 0;font-size:13px;opacity:.85}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.uchip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.page-title{position:relative;z-index:1;margin:18px 2px 0;font-size:15px;opacity:.9}

main{padding:0 16px;margin-top:-46px;position:relative;z-index:2}
.banner{margin:0 16px 0;position:relative;z-index:3}
.note{background:#FFF7E6;border:1px solid #FDE2A7;color:#8A5A00;border-radius:14px;padding:10px 14px;font-size:13.5px;margin:-36px 0 46px}
.note.err{background:#FFF0F2;border-color:#FBC5CF;color:#A3123A}

/* hero */
.hero{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--sh)}
.hero-l{color:var(--mut);font-size:14px}
.hero-n{font-size:38px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.hero-n small{font-size:15px;color:var(--mut);font-weight:700;margin-inline-start:4px}
.hero-s{color:var(--mut);font-size:13.5px}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mine div{border-radius:16px;padding:12px}
.mine .in{background:#E7FAF6;color:#0B7F73}.mine .out{background:#FFEDED;color:#C23B3B}
.mine span{font-size:12.5px;display:block}.mine b{font-size:19px}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.qbtn{border:0;border-radius:20px;padding:14px 8px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 8px 18px rgba(0,0,0,.08);transition:transform .15s}
.qbtn:active{transform:scale(.96)}
.qbtn .ic{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.q1{background:linear-gradient(140deg,#F59E0B,#F97316)}
.q2{background:linear-gradient(140deg,#6C5CE7,#8B5CF6)}
.q3{background:linear-gradient(140deg,#10B5A4,#06B6D4)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.stat .si{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12.5px;color:var(--mut)}

.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.sec h2{font-size:17px;margin:0;font-weight:800}
.sec .lnk{background:none;border:0;color:var(--pri);font-weight:700;font-size:14px}

/* cards */
.lcard{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;transition:transform .12s;border:1px solid transparent}
.lcard:active{transform:scale(.99)}
.lc-top{display:flex;align-items:center;gap:12px}
.lc-who{flex:1;min-width:0}
.lc-who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-who span{font-size:13px;color:var(--mut)}
.lc-amt{font-size:19px;font-weight:800;white-space:nowrap}
.lc-amt small{font-size:12px;color:var(--mut);margin-inline-start:3px}
.lc-mid{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.code{font-size:12px;color:var(--mut);direction:ltr;margin-inline-start:auto}
.bar{height:8px;background:#EEF0F7;border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#10B5A4,#22B573);border-radius:9px}
.lc-foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.inline-acts{display:flex;gap:8px;margin-top:12px}
.inline-acts .btn{flex:1;padding:10px}

.av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.av.sm{width:34px;height:34px;border-radius:11px;font-size:13px}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:24px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-amber{background:#FFF4DE;color:#B76E00}.c-sky{background:#E3F1FF;color:#1F6FD1}
.c-violet{background:#EFEAFF;color:#6D3FE0}.c-teal{background:#DDF7F3;color:#0B8A7D}
.c-green{background:#E1F7EA;color:#178A55}.c-rose{background:#FFE7EB;color:#C81E45}
.c-gray{background:#EEF1F5;color:#5B6779}
.tag-late{background:#FFE7EB;color:#C81E45;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:8px}

.empty{text-align:center;background:var(--card);border-radius:24px;padding:32px 20px;box-shadow:var(--sh);color:var(--mut)}
.empty h3{color:var(--ink);margin:12px 0 6px}
.empty .btn{margin-top:14px}

.act-row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border:0}
.act-dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:15px}
.act-row .t{flex:1;font-size:14px}
.act-row .t small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.panel{background:var(--card);border-radius:var(--r);padding:6px 14px;box-shadow:var(--sh)}

/* toolbar */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--sh)}
.search input{border:0;outline:0;background:none;flex:1;padding:14px 0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(48,38,120,.06);color:var(--mut)}
.fbtn.on{background:var(--ink);color:#fff}
.fbtn i{font-style:normal;opacity:.7;margin-inline-start:4px}

/* buttons */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#6C5CE7,#8B5CF6);color:#fff;box-shadow:0 8px 18px rgba(108,92,231,.3)}
.btn.teal{background:linear-gradient(135deg,#10B5A4,#06B6D4);color:#fff}
.btn.sky{background:#E3F1FF;color:#1F6FD1}
.btn.rose{background:#FFE7EB;color:#C81E45}
.btn.ghost{background:#F1F0F8;color:var(--ink)}
.btn.green{background:linear-gradient(135deg,#22B573,#10B5A4);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);margin:0 12px 12px;border-radius:24px;box-shadow:0 10px 30px rgba(40,30,110,.15);display:flex;align-items:center;padding:8px;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#9A98B3;padding:6px 0;border-radius:16px}
.nav button.on{color:var(--pri)}
.nav button.on svg{stroke:var(--pri)}
.nav .fab{flex:none;width:56px;height:56px;margin:-30px 6px 0;border-radius:19px;background:linear-gradient(135deg,#F59E0B,#EC4899);color:#fff;box-shadow:0 10px 22px rgba(236,72,153,.35);justify-content:center}
.nav svg{width:23px;height:23px;fill:none;stroke:#9A98B3;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .fab svg{stroke:#fff;width:26px;height:26px;stroke-width:2.4}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(22,18,50,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;transform:translateY(30px);transition:transform .25s;padding:0 0 24px}
.sheet-wrap.open .sheet{transform:none}
.sh-head{position:sticky;top:0;background:var(--bg);z-index:2;padding:10px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.sh-head:before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:9px;background:#D6D4E6}
.sh-head h3{margin:14px 0 0;font-size:19px;font-weight:800}
.xbtn{margin-top:14px;width:36px;height:36px;border-radius:12px;border:0;background:#E9E8F3;font-size:20px;line-height:1}
.sh-body{padding:4px 18px}

/* forms */
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.fld label small{color:var(--mut);font-weight:500}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;transition:border .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(108,92,231,.12)}
textarea.inp{min-height:84px;resize:vertical}
.amt-inp{font-size:24px;font-weight:800;text-align:center;direction:ltr}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips-sel{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips-sel button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px}
.chips-sel button.on{border-color:var(--pri);background:#EFEAFF;color:var(--pri-d)}
.check{display:flex;gap:10px;align-items:flex-start;background:#E7FAF6;border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px;color:#0B6F65}
.check input{width:20px;height:20px;accent-color:var(--teal);margin:0}
.flow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--mut);box-shadow:var(--sh)}
.flow b{color:var(--ink)}
.hint{font-size:13px;color:var(--mut);margin:-6px 0 14px}

/* loan detail */
.dhero{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden}
.dhero:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);top:-60px;left:-40px}
.g-amber{background:linear-gradient(135deg,#F59E0B,#F97316)}.g-sky{background:linear-gradient(135deg,#3B9EFF,#6C5CE7)}
.g-violet{background:linear-gradient(135deg,#8B5CF6,#EC4899)}.g-teal{background:linear-gradient(135deg,#10B5A4,#06B6D4)}
.g-green{background:linear-gradient(135deg,#22B573,#10B5A4)}.g-rose{background:linear-gradient(135deg,#F43F5E,#FB7185)}
.g-gray{background:linear-gradient(135deg,#64748B,#94A3B8)}
.dhero .st{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;display:inline-block}
.dhero .amt{font-size:36px;font-weight:800;margin:10px 0 0}
.dhero .amt small{font-size:15px;opacity:.85}
.dhero .cd{font-size:12.5px;opacity:.85;direction:ltr;text-align:right}
.dhero .bar{background:rgba(255,255,255,.25)}.dhero .bar i{background:#fff}
.dhero .lc-foot{color:rgba(255,255,255,.9)}
.parties{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.party{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.party div{min-width:0}
.party small{display:block;color:var(--mut);font-size:12px}
.party b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--pri);flex:none}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.info div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.info small{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.info b{font-size:14.5px}
.notes{background:#FFFBEA;border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;white-space:pre-wrap;color:#6B5310}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{flex:1 1 30%}
.wait{background:#F1F0F8;border-radius:14px;padding:12px;font-size:14px;color:var(--mut);margin-top:14px;text-align:center}
.tl{position:relative;padding-inline-start:22px}
.tl:before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:#E3E1F0}
.tl-i{position:relative;padding:0 0 14px}
.tl-i:before{content:"";position:absolute;inset-inline-start:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:3px solid #E6E1FF}
.tl-i b{font-size:14px;display:block}
.tl-i small{color:var(--mut);font-size:12px}
.tl-i p{margin:4px 0 0;font-size:13px;background:var(--card);padding:8px 10px;border-radius:10px}
.rrow{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.rrow .top2{display:flex;align-items:center;gap:10px}
.rrow .top2 div{flex:1}
.rrow small{color:var(--mut);font-size:12px}
.foot-acts{display:flex;gap:8px;margin-top:18px}
.foot-acts .btn{flex:1}

/* receipt */
.rcpt{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);position:relative;overflow:hidden;border:1.5px dashed #D7D3EE}
.rc-h{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px dashed #E7E4F5;margin-bottom:8px}
.rc-logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#6C5CE7,#EC4899);display:grid;place-items:center;color:#fff}
.rc-h b{display:block;font-size:18px}
.rc-h span{font-size:12.5px;color:var(--mut);direction:ltr;display:inline-block}
.rc-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F1F0F8;font-size:14px}
.rc-row span{color:var(--mut)}
.rc-amt{margin:14px 0;background:linear-gradient(135deg,#F3F0FF,#FFEFF7);border-radius:16px;padding:14px;text-align:center}
.rc-amt small{display:block;color:var(--mut);font-size:12.5px}
.rc-amt b{font-size:30px;font-weight:800;color:var(--pri-d)}
.stamp{position:absolute;top:70px;left:14px;transform:rotate(-14deg);border:3px solid;border-radius:12px;padding:4px 12px;font-weight:800;font-size:15px;opacity:.75}
.stamp.green{color:#178A55}.stamp.amber{color:#B76E00}.stamp.rose{color:#C81E45}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;font-size:12.5px;color:var(--mut);text-align:center}
.sig div{border-top:1.5px solid #D9D6EA;padding-top:6px}

/* dialog & toast */
.dlg{position:fixed;inset:0;z-index:60;background:rgba(22,18,50,.5);display:none;align-items:center;justify-content:center;padding:20px}
.dlg.open{display:flex}
.dlg-b{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:400px;animation:pop .2s}
.dlg-b h4{margin:0 0 6px;font-size:18px}
.dlg-b p{margin:0 0 14px;color:var(--mut);font-size:14.5px;line-height:1.6}
.dlg-b .row2{margin-top:6px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:70;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:#178A55}.toast.err{background:#C81E45}

.pcard{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pcard .who{flex:1;min-width:0}
.pcard .who b{display:block}
.pcard .who small{color:var(--mut);font-size:12.5px}
.bal{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:12.5px;font-weight:800}
.bal .g{color:#0B8A7D;background:#DDF7F3;padding:3px 8px;border-radius:8px}
.bal .r{color:#C81E45;background:#FFE7EB;padding:3px 8px;border-radius:8px}
.me-tag{background:#EFEAFF;color:var(--pri-d);font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;margin-inline-start:6px}
.chooser{display:grid;gap:10px}
.chooser button{display:flex;align-items:center;gap:14px;border:0;background:var(--card);border-radius:20px;padding:14px;text-align:start;box-shadow:var(--sh)}
.chooser button b{display:block;font-size:16px}
.chooser button small{color:var(--mut);font-size:13px}
.chooser .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.skel{height:90px;border-radius:20px;background:linear-gradient(90deg,#ECEBF5,#F7F6FC,#ECEBF5);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
<style>
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#6C5CE7 0%,#9B59F0 45%,#EC4899 100%);position:relative;overflow:hidden}
.auth:before,.auth:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.auth:before{width:320px;height:320px;top:-120px;left:-100px}.auth:after{width:240px;height:240px;bottom:-80px;right:-60px}
.auth-card{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(30,20,90,.25);position:relative;z-index:1}

<body>
<div id="root"></div>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="dlg" id="dlg"><div class="dlg-b" id="dlgB"></div></div>
<div class="toast" id="toast"></div>
<datalist id="peopleList"></datalist>

<script>
/* ========= config ========= */
const API='https://rueapdmdkjytsxkfumpw.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_CihlHx8brphzcuqf3imxeA_u9a1zVy9';

/* ========= helpers ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const money=n=>nf.format(+n||0);
let dfmt;try{dfmt=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){dfmt=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'})}
const fdate=d=>{if(!d)return '—';const x=typeof d==='number'?new Date(d):new Date(String(d).length===10?d+'T12:00:00':d);return isNaN(x)?'—':dfmt.format(x)};
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ago(ts){if(!ts)return '';const s=(Date.now()-ts)/1000;let rtf;try{rtf=new Intl.RelativeTimeFormat('ar',{numeric:'auto'})}catch(e){return fdate(ts)}
  if(s<60)return 'الآن';if(s<3600)return rtf.format(-Math.round(s/60),'minute');if(s<86400)return rtf.format(-Math.round(s/3600),'hour');if(s<86400*30)return rtf.format(-Math.round(s/86400),'day');return fdate(ts)}
const PAL=['#6C5CE7','#10B5A4','#FF6B6B','#F59E0B','#3B9EFF','#EC4899','#22B573','#8B5CF6','#F97316','#06B6D4'];
function hue(s){let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]}
function initials(n){const w=String(n||'؟').trim().split(/\s+/);return (w[0]?.[0]||'؟')+(w[1]?.[0]||'')}
function avatar(name,cls=''){return `<div class="av ${cls}" style="background:${hue(name)}">${esc(initials(name))}</div>`}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const IC={
  req:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  give:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  user:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  wallet:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  done:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24" style="color:#9A98B3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  ref:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  logo:'<svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px"><path d="M4 8h13a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a2 2 0 0 1-2-2z"/><path d="M4 8V7a3 3 0 0 1 3-3h9"/><circle cx="16" cy="14" r="1.4"/></svg>'
};
const NAV=`<nav class="nav"><div class="nav-in">
  <button data-act="tab" data-id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button data-act="tab" data-id="loans"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>السلف</button>
  <button class="fab" data-act="fab" aria-label="عملية جديدة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-id="reps"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>السندات</button>
  <button data-act="tab" data-id="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c1.9.6 3.1 2.5 3.5 5.5"/></svg>الأشخاص</button>
</div></nav>`;

const ST={
  pending_lender:{t:'بانتظار موافقة المُسلِّف',c:'amber'},
  approved:{t:'موافق عليها – بانتظار الصرف',c:'sky'},
  pending_borrower:{t:'بانتظار اعتماد المستلف',c:'violet'},
  active:{t:'سارية',c:'teal'},
  closed:{t:'مسددة بالكامل',c:'green'},
  rejected:{t:'مرفوضة',c:'rose'},
  cancelled:{t:'ملغاة',c:'gray'}
};
const RST={pending:{t:'بانتظار تأكيد الاستلام',c:'amber'},confirmed:{t:'مؤكد',c:'green'},rejected:{t:'مرفوض',c:'rose'}};
const LOGT={created_request:['تقديم طلب سلفة','📝'],created_grant:['تسجيل سلفة','💸'],approved:['الموافقة على الطلب','👍'],disbursed:['صرف السلفة','💰'],accepted:['اعتماد المستلف للسلفة','✅'],rejected:['رفض','⛔'],disputed:['اعتراض المستلف','⚠️'],cancelled:['إلغاء','✖️'],repay_added:['سند استرداد جديد','🧾'],repay_confirmed:['تأكيد استلام مبلغ مسترد','✔️'],repay_rejected:['رفض سند استرداد','⛔'],closed:['سُددت السلفة بالكامل','🎉']};
const chip=(s,map=ST)=>{const x=map[s]||{t:s,c:'gray'};return `<span class="chip c-${x.c}">${esc(x.t)}</span>`};
const ERR={AUTH:'انتهت الجلسة، سجّل الدخول مرة ثانية',LOCKED:'محاولات كثيرة خاطئة، حاول بعد 10 دقائق',BAD_LOGIN:'اسم المستخدم أو الرمز غير صحيح',
  BAD_USERNAME:'اسم المستخدم: حروف عربية أو إنجليزية أو أرقام بدون مسافات (حرفين على الأقل)',BAD_PIN:'الرمز السري من 4 إلى 8 أرقام',SAME_PERSON:'المستلف والمُسلِّف لا يكونان نفس الشخص',
  FORBIDDEN_REQUEST:'تقدر تطلب سلفة باسمك فقط',FORBIDDEN_GRANT:'تقدر تسجّل سلفة دفعتها أنت فقط',NOT_ALLOWED:'ما عندك صلاحية لهذا الإجراء',NOT_FOUND:'العنصر غير موجود',
  NOT_ACTIVE:'السلفة ليست سارية',EXCEEDS:'المبلغ أكبر من المتبقي على السلفة',NAME_TAKEN:'يوجد شخص بنفس الاسم',USERNAME_TAKEN:'اسم المستخدم مستخدم من قبل',
  PIN_REQUIRED:'حدّد رمزاً سرياً لهذا المستخدم',SELF_ADMIN:'ما تقدر تشيل صلاحية المدير أو الدخول عن نفسك',HAS_LOANS:'ما يمكن حذف شخص له سلف مسجلة',
  BAD_OLD_PIN:'الرمز الحالي غير صحيح',ALREADY_SETUP:'تم إعداد التطبيق مسبقاً، سجّل الدخول',BAD_AMOUNT:'أدخل مبلغاً صحيحاً',NAME_REQUIRED:'اكتب الاسم',NAME_TOO_LONG:'الاسم طويل جداً',NET:'تعذّر الاتصال، تأكد من الإنترنت'};
const normUser=u=>String(u||'').trim().replace(/\s+/g,'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const normPin=p=>String(p||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const USER_RE=/^[a-z0-9_.ء-ي]{2,30}$/;
const errMsg=e=>ERR[e&&e.code]||ERR[e&&e.message]||'حدث خطأ، حاول مرة أخرى';

/* ========= API ========= */
async function rpc(fn,args={}){let r;
  try{r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(args)})}
  catch(e){const x=new Error('NET');x.code='NET';throw x}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const code=(j&&j.message)||'ERR';const x=new Error(code);x.code=code;if(code==='AUTH')setTimeout(sessionExpired,0);throw x}
  return j}
const T=()=>S.token;

/* ========= state ========= */
const S={view:'boot',token:lsGet('slf_token'),me:null,people:[],loans:[],reps:[],loaded:false,loading:false,
  tab:'home',lf:'all',rf:'all',q:'',sheet:null,lastSync:0};

async function load(silent){if(!S.token||S.loading)return;S.loading=true;if(!silent)updRefresh();
  try{const d=await rpc('slf_data',{p_token:T()});
    S.me=d.me;S.people=d.people||[];
    const logs={};(d.logs||[]).forEach(g=>{(logs[g.loanId]=logs[g.loanId]||[]).push({...g,at:Date.parse(g.at)})});
    S.loans=(d.loans||[]).map(l=>({...l,amount:+l.amount,createdAt:Date.parse(l.createdAt),log:logs[l.id]||[]}));
    S.reps=(d.reps||[]).map(r=>({...r,amount:+r.amount,createdAt:Date.parse(r.createdAt)}));
    S.loaded=true;S.view='app';S.lastSync=Date.now();S.netErr=false}
  catch(e){if(e.code==='NET'){S.netErr=true;if(!silent)toast(ERR.NET,'err')}else if(e.code!=='AUTH'&&!silent)toast(errMsg(e),'err')}
  finally{S.loading=false;render()}}
function sessionExpired(){if(!S.token)return;S.token=null;lsSet('slf_token',null);S.me=null;S.loaded=false;closeSheet();S.view='login';render();toast(ERR.AUTH,'err')}
async function act(fn,args,okMsg){try{await rpc(fn,{p_token:T(),...args});await load(true);if(okMsg)toast(okMsg,'ok');return true}catch(e){if(e.code!=='AUTH')toast(errMsg(e),'err');await load(true);return false}}

/* ========= derived ========= */
const person=id=>S.people.find(p=>p.id===id);
const pname=id=>person(id)?.name||'—';
const loan=id=>S.loans.find(l=>l.id===id);
const rep=id=>S.reps.find(r=>r.id===id);
const isAdmin=()=>!!S.me?.is_admin;
function canAct(pid){if(!S.me)return false;if(pid===S.me.id)return true;const p=person(pid);return isAdmin()&&!!p&&!p.has_login}
const repsOf=l=>S.reps.filter(r=>r.loanId===l.id);
const repaid=l=>repsOf(l).filter(r=>r.status==='confirmed').reduce((a,r)=>a+(+r.amount||0),0);
const pendingRepSum=l=>repsOf(l).filter(r=>r.status==='pending').reduce((a,r)=>a+(+r.amount||0),0);
const remaining=l=>Math.max(0,Math.round(((+l.amount||0)-repaid(l))*100)/100);
const isLate=l=>l.status==='active'&&l.due&&l.due<today();
const byNew=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
function uname(id){if(!id)return '';if(S.me&&id===S.me.id)return 'أنت';return pname(id)}
function todo(){const out=[];
  S.loans.forEach(l=>{
    if(l.status==='pending_lender'&&canAct(l.lenderId))out.push({l,why:'طلب سلفة يحتاج موافقتك'});
    else if(l.status==='approved'&&canAct(l.lenderId))out.push({l,why:'موافق عليها – بانتظار الصرف'});
    else if(l.status==='pending_borrower'&&canAct(l.borrowerId))out.push({l,why:'سلفة تحتاج اعتمادك'});
  });
  S.reps.forEach(r=>{const l=loan(r.loanId);if(l&&r.status==='pending'&&canAct(l.lenderId))out.push({l,r,why:'سند استرداد بانتظار تأكيد الاستلام'})});
  return out}

/* ========= render ========= */
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
const TITLES={home:'نظرة عامة',loans:'السلف',reps:'سندات الاسترداد',people:'الأشخاص'};
function render(){const root=$('#root');
  if(S.view==='boot'){root.innerHTML=`<div class="auth"><div class="auth-card" style="text-align:center"><div class="auth-logo">${IC.logo}</div><h2>سلفتي</h2><div class="sub">جاري التحميل…</div></div></div>`;return}
  if(S.view==='login'||S.view==='setup'){if(!root.querySelector('.auth form'))root.innerHTML=authView();else if(root.querySelector('.auth form').dataset.form!==S.view)root.innerHTML=authView();return}
  if(!root.querySelector('.wrap')){root.innerHTML=`<div class="wrap"><header class="top"><div class="hdr-row"><div class="brand"><div class="logo">${IC.logo.replace('34px','26px').replace('34px','26px')}</div><div><h1>سلفتي</h1><p>سجل السلف والطلبات والاستردادات</p></div></div><div id="hdrUser"></div></div><div class="hdr-row" style="margin-top:16px"><div class="page-title" id="pageTitle" style="margin:0"></div><button class="refresh" data-act="refresh" id="refBtn">${IC.ref}<span id="refTxt">تحديث</span></button></div></header><div class="banner" id="banner"></div><main id="view"></main></div>${NAV}`}
  $('#hdrUser').innerHTML=S.me?`<button class="uchip" data-act="account">${esc(S.me.name)}${isAdmin()?' · مدير':''}</button>`:'';
  $('#pageTitle').textContent=TITLES[S.tab];
  $('#banner').innerHTML=S.netErr?`<div class="note err">تعذّر الاتصال بالخادم. البيانات المعروضة قد لا تكون محدّثة.</div>`:'';
  updRefresh();
  const qFocused=document.activeElement&&document.activeElement.id==='q';
  if(qFocused&&S.tab==='loans')$('#loanList').innerHTML=loansListHTML();
  else $('#view').innerHTML=!S.loaded?'<div class="skel" style="height:150px"></div><div class="skel"></div><div class="skel"></div>':({home:vHome,loans:vLoans,reps:vReps,people:vPeople})[S.tab]();
  document.querySelectorAll('.nav button[data-act=tab]').forEach(x=>x.classList.toggle('on',x.dataset.id===S.tab));
  $('#peopleList').innerHTML=S.people.map(p=>`<option value="${esc(p.name)}">`).join('');
  if(S.sheet&&['loan','voucher','person','account'].includes(S.sheet.type))renderSheet();
}
function updRefresh(){const b=$('#refBtn');if(!b)return;b.querySelector('svg').classList.toggle('spin',S.loading);$('#refTxt').textContent=S.loading?'تحديث…':(S.lastSync?ago(S.lastSync):'تحديث')}

function authView(){const setup=S.view==='setup';
  return `<div class="auth"><form class="auth-card" data-form="${S.view}" autocomplete="on">
   <div class="auth-logo">${IC.logo}</div><h2>سلفتي</h2>
   <div class="sub">${setup?'أول مرة؟ أنشئ حساب المدير لإدارة السلف والموظفين':'سجّل دخولك لمتابعة سلفك'}</div>
   ${setup?`<div class="fld"><label>اسمك</label><input class="inp" name="name" required placeholder="مثال: عبدالرحمن" autocomplete="name"></div>`:''}
   <div class="fld"><label>اسم المستخدم</label><input class="inp" dir="auto" name="username" required autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="مثال: ابوقصي" autocomplete="username" value="${esc(lsGet('slf_user')||'')}"></div>
   <div class="fld"><label>الرمز السري</label><input class="inp pin" name="pin" type="password" inputmode="numeric" maxlength="8" required placeholder="••••" autocomplete="${setup?'new-password':'current-password'}"></div>
   ${setup?`<div class="fld"><label>تأكيد الرمز</label><input class="inp pin" name="pin2" type="password" inputmode="numeric" maxlength="8" required placeholder="••••" autocomplete="new-password"></div>
   <div class="hint">اسم المستخدم بالعربي أو الإنجليزي بدون مسافات. الرمز من 4 إلى 8 أرقام.</div>`:''}
   <button class="btn pri block" type="submit">${setup?'إنشاء حساب المدير':'دخول'}</button>
   ${setup?'':'<div class="hint" style="text-align:center;margin:14px 0 0">ما عندك حساب؟ اطلبه من مدير التطبيق.</div>'}
  </form></div>`}

function loanCard(l,extra=''){
  const rp=repaid(l),pct=l.amount?Math.min(100,rp/l.amount*100):0;
  return `<div class="lcard" data-act="openLoan" data-id="${l.id}">
    <div class="lc-top">${avatar(pname(l.borrowerId))}
      <div class="lc-who"><b>${esc(pname(l.borrowerId))}</b><span>استلف من ${esc(pname(l.lenderId))}</span></div>
      <div class="lc-amt">${money(l.amount)}<small>ر.س</small></div></div>
    <div class="lc-mid">${chip(l.status)}${isLate(l)?'<span class="tag-late">متأخرة</span>':''}<span class="code">${esc(l.code)}</span></div>
    ${['active','closed'].includes(l.status)?`<div class="bar"><i style="width:${pct}%"></i></div><div class="lc-foot"><span>مسدد ${money(rp)}</span><span>متبقي ${money(remaining(l))}</span></div>`:''}
    ${extra}</div>`}
function emptyBox(title,sub,btn){return `<div class="empty"><svg viewBox="0 0 120 90" width="120" height="90"><rect x="10" y="20" width="100" height="60" rx="14" fill="#EFEAFF"/><rect x="22" y="34" width="50" height="8" rx="4" fill="#C9BEFF"/><rect x="22" y="50" width="34" height="8" rx="4" fill="#DDD5FF"/><circle cx="88" cy="50" r="14" fill="#FFD7E8"/><path d="M82 50l4 4 8-9" stroke="#EC4899" stroke-width="3" fill="none" stroke-linecap="round"/></svg><h3>${title}</h3><div>${sub}</div>${btn||''}</div>`}

function vHome(){
  const act=S.loans.filter(l=>l.status==='active');
  const out=act.reduce((a,l)=>a+remaining(l),0);
  const rec=S.reps.filter(r=>r.status==='confirmed').reduce((a,r)=>a+(+r.amount||0),0);
  const closed=S.loans.filter(l=>l.status==='closed').length;
  const late=act.filter(isLate).length;
  const t=todo(),m=S.me;
  const inn=act.filter(l=>l.lenderId===m.id).reduce((a,l)=>a+remaining(l),0),ow=act.filter(l=>l.borrowerId===m.id).reduce((a,l)=>a+remaining(l),0);
  let h=`<div class="hero"><div class="hero-l">${isAdmin()?'المتبقي على كل السلف السارية':'المتبقي على سلفك السارية'}</div>
    <div class="hero-n">${money(out)}<small>ر.س</small></div>
    <div class="hero-s">${act.length} سلفة سارية · ${closed} مسددة${late?` · <b style="color:#C81E45">${late} متأخرة</b>`:''}</div>
    <div class="mine"><div class="in"><span>لك عند الناس</span><b>${money(inn)}</b> ر.س</div><div class="out"><span>عليك للناس</span><b>${money(ow)}</b> ر.س</div></div></div>
  <div class="quick">
    <button class="qbtn q1" data-act="newRequest"><span class="ic">${IC.req}</span>طلب سلفة</button>
    <button class="qbtn q2" data-act="newGrant"><span class="ic">${IC.give}</span>تسجيل سلفة</button>
    <button class="qbtn q3" data-act="newRep"><span class="ic">${IC.back}</span>سند استرداد</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="si" style="background:#DDF7F3;color:#0B8A7D">${IC.wallet}</div><div><b>${act.length}</b><span>سلف سارية</span></div></div>
    <div class="stat"><div class="si" style="background:#FFF4DE;color:#B76E00">${IC.clock}</div><div><b>${t.length}</b><span>بانتظار إجرائك</span></div></div>
    <div class="stat"><div class="si" style="background:#EFEAFF;color:#6D3FE0">${IC.back}</div><div><b>${money(rec)}</b><span>إجمالي المسترد</span></div></div>
    <div class="stat"><div class="si" style="background:#E1F7EA;color:#178A55">${IC.done}</div><div><b>${closed}</b><span>مسددة بالكامل</span></div></div>
  </div>`;
  if(isAdmin()&&S.people.filter(p=>p.has_login).length<2)h+=`<div class="lcard" style="margin-top:16px;background:linear-gradient(135deg,#EFEAFF,#FFEFF7)" data-act="newPerson"><div class="lc-top"><div class="av" style="background:linear-gradient(135deg,#6C5CE7,#EC4899)">${IC.user}</div><div class="lc-who"><b>أضف الموظفين</b><span>أعطِ كل موظف اسم مستخدم ورمزاً ليدخل ويعتمد سلفه بنفسه</span></div></div></div>`;
  if(!S.loans.length){h+=`<div style="margin-top:18px">${emptyBox('ابدأ بأول سلفة','سجّل سلفة أعطيتها لأحد، أو قدّم طلب سلفة.','<button class="btn pri" data-act="newRequest">'+IC.plus+' طلب سلفة</button>')}</div>`;return h}
  if(t.length){h+=`<div class="sec"><h2>بانتظار إجرائك</h2></div>`+t.slice(0,6).map(x=>x.r?repCard(x.r,true):loanCard(x.l,`<div class="hint" style="margin:10px 0 0;color:#B76E00;font-weight:700">● ${x.why}</div>`)).join('')}
  const ev=[];S.loans.forEach(l=>(l.log||[]).forEach(e=>ev.push({e,l})));ev.sort((a,b)=>(b.e.at||0)-(a.e.at||0));
  if(ev.length){h+=`<div class="sec"><h2>آخر الحركات</h2><button class="lnk" data-act="tab" data-id="loans">كل السلف</button></div><div class="panel">`+ev.slice(0,8).map(({e,l})=>{const T=LOGT[e.t]||[e.t,'•'];
    return `<div class="act-row" data-act="openLoan" data-id="${l.id}" style="cursor:pointer"><div class="act-dot" style="background:${hue(pname(l.borrowerId))}22">${T[1]}</div><div class="t">${esc(T[0])} · <b>${esc(pname(l.borrowerId))}</b><small>${ago(e.at)}${uname(e.by)?' · بواسطة '+esc(uname(e.by)):''}</small></div><b style="font-size:14px">${money(e.amt??l.amount)}</b></div>`}).join('')+`</div>`}
  return h}

function loanFilterMatch(l,f=S.lf){
  if(f==='pending')return ['pending_lender','approved','pending_borrower'].includes(l.status);
  if(f==='active')return l.status==='active';if(f==='late')return isLate(l);if(f==='closed')return l.status==='closed';
  if(f==='rejected')return ['rejected','cancelled'].includes(l.status);return true}
function loansListHTML(){const q=S.q.trim();
  const list=S.loans.filter(l=>loanFilterMatch(l)).filter(l=>!q||[pname(l.borrowerId),pname(l.lenderId),l.code,l.notes].join(' ').includes(q)).sort(byNew);
  return list.length?list.map(l=>loanCard(l)).join(''):emptyBox('لا توجد سلف هنا','جرّب فلتراً آخر أو أضف سلفة جديدة.')}
function vLoans(){
  const F=[['all','الكل'],['pending','بانتظار'],['active','سارية'],['late','متأخرة'],['closed','مسددة'],['rejected','مرفوضة/ملغاة']];
  return `<div class="search">${IC.search}<input id="q" placeholder="ابحث بالاسم أو رقم السلفة…" value="${esc(S.q)}"></div>
  <div class="filters">${F.map(([k,t])=>`<button class="fbtn ${S.lf===k?'on':''}" data-act="lf" data-id="${k}">${t}<i>${S.loans.filter(l=>loanFilterMatch(l,k)).length}</i></button>`).join('')}</div>
  <div id="loanList">${loansListHTML()}</div>`}

function repCard(r,withActs){const l=loan(r.loanId);if(!l)return '';
  const acts=withActs&&r.status==='pending'&&canAct(l.lenderId)?`<div class="inline-acts"><button class="btn green" data-act="repConfirm" data-id="${r.id}">${IC.check} تأكيد الاستلام</button><button class="btn rose" data-act="repReject" data-id="${r.id}">رفض</button></div>`:'';
  return `<div class="lcard" data-act="openRep" data-id="${r.id}">
   <div class="lc-top">${avatar(pname(l.borrowerId))}<div class="lc-who"><b>${esc(pname(l.borrowerId))}</b><span>ردّ إلى ${esc(pname(l.lenderId))} · ${esc(r.method||'')}</span></div><div class="lc-amt" style="color:#0B8A7D">${money(r.amount)}<small>ر.س</small></div></div>
   <div class="lc-mid">${chip(r.status,RST)}<span style="font-size:12.5px;color:var(--mut)">${fdate(r.date)}</span><span class="code">${esc(r.code)}</span></div>${acts}</div>`}
function vReps(){
  const F=[['all','الكل'],['pending','بانتظار التأكيد'],['confirmed','مؤكدة'],['rejected','مرفوضة']];
  const list=S.reps.filter(r=>S.rf==='all'||r.status===S.rf).sort(byNew);
  const tot=S.reps.filter(r=>r.status==='confirmed').reduce((a,r)=>a+(+r.amount||0),0);
  return `<div class="hero"><div class="hero-l">إجمالي المبالغ المستردة المؤكدة</div><div class="hero-n">${money(tot)}<small>ر.س</small></div><div class="hero-s">${S.reps.length} سند · ${S.reps.filter(r=>r.status==='pending').length} بانتظار التأكيد</div>
   <button class="btn teal block" style="margin-top:14px" data-act="newRep">${IC.plus} سند استرداد جديد</button></div>
   <div class="filters">${F.map(([k,t])=>`<button class="fbtn ${S.rf===k?'on':''}" data-act="rf" data-id="${k}">${t}</button>`).join('')}</div>
   ${list.length?list.map(r=>repCard(r,true)).join(''):emptyBox('لا توجد سندات','عند إرجاع مبلغ من سلفة، أنشئ سند استرداد.')}`}

function balOf(p){const act=S.loans.filter(l=>l.status==='active');return{inn:act.filter(l=>l.lenderId===p.id).reduce((a,l)=>a+remaining(l),0),ow:act.filter(l=>l.borrowerId===p.id).reduce((a,l)=>a+remaining(l),0)}}
const roleTag=p=>p.is_admin?'<span class="role adm">مدير</span>':p.has_login?'<span class="role acc">له حساب</span>':(isAdmin()?'<span class="role no">بدون حساب</span>':'');
function vPeople(){
  let list=[...S.people].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  if(!isAdmin()){const ids=new Set();S.loans.forEach(l=>{ids.add(l.borrowerId);ids.add(l.lenderId)});ids.add(S.me.id);list=list.filter(p=>ids.has(p.id))}
  return `<div class="hero" style="display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="hero-l">${isAdmin()?'كل الأشخاص':'الأشخاص في سلفك'}</div><div class="hero-n" style="font-size:30px">${list.length}</div>
   ${isAdmin()?`<div class="hero-s">${S.people.filter(p=>p.has_login).length} منهم لهم حساب دخول</div>`:''}</div>${isAdmin()?`<button class="btn pri" data-act="newPerson">${IC.plus} شخص</button>`:''}</div>
  <div style="height:14px"></div>
  ${list.length?list.map(p=>{const b=balOf(p);const n=S.loans.filter(l=>l.lenderId===p.id||l.borrowerId===p.id).length;
    return `<div class="pcard" data-act="openPerson" data-id="${p.id}">${avatar(p.name)}<div class="who"><b>${esc(p.name)}${p.id===S.me.id?'<span class="me-tag">أنت</span>':''}${roleTag(p)}</b><small>${n} سلفة${p.phone?' · '+esc(p.phone):''}</small></div>
    <div class="bal">${b.inn?`<span class="g">له ${money(b.inn)}</span>`:''}${b.ow?`<span class="r">عليه ${money(b.ow)}</span>`:''}</div></div>`}).join(''):emptyBox('لا يوجد أشخاص بعد','')}`}

/* ========= sheets ========= */
function openSheet(s){S.sheet=s;renderSheet();$('#sheetWrap').classList.add('open')}
function closeSheet(){S.sheet=null;$('#sheetWrap').classList.remove('open')}
function head(t){return `<div class="sh-head"><h3>${t}</h3><button class="xbtn" data-act="closeSheet" aria-label="إغلاق">×</button></div>`}
function renderSheet(){const s=S.sheet;if(!s)return;const el=$('#sheet');const st=el.scrollTop;let h='';
  if(s.type==='actions')h=head('عملية جديدة')+`<div class="sh-body"><div class="chooser">
    <button data-act="newRequest"><span class="ic q1">${IC.req}</span><div><b>طلب سلفة</b><small>${isAdmin()?'شخص يطلب سلفة من آخر':'تطلب سلفة من شخص'}، والمُسلِّف يوافق ويصرف</small></div></button>
    <button data-act="newGrant"><span class="ic q2">${IC.give}</span><div><b>تسجيل سلفة مباشرة</b><small>${isAdmin()?'سلفة مدفوعة':'سلّفت شخصاً مبلغاً'}، والمستلف يعتمدها</small></div></button>
    <button data-act="newRep"><span class="ic q3">${IC.back}</span><div><b>سند استرداد سلفة</b><small>تسجيل مبلغ مُرجَع كلياً أو جزئياً</small></div></button>
    ${isAdmin()?`<button data-act="newPerson"><span class="ic" style="background:linear-gradient(135deg,#EC4899,#F97316)">${IC.user}</span><div><b>إضافة شخص / موظف</b><small>مع اسم مستخدم ورمز دخول</small></div></button>`:''}</div></div>`;
  else if(s.type==='loanForm')h=loanForm(s.kind);
  else if(s.type==='repForm')h=repForm(s.loanId);
  else if(s.type==='personForm')h=personForm(s.id);
  else if(s.type==='loan')h=loanSheet(s.id);
  else if(s.type==='voucher')h=voucherSheet(s.kind,s.id);
  else if(s.type==='person')h=personSheet(s.id);
  else if(s.type==='account')h=accountSheet();
  else if(s.type==='share')h=shareSheet(s);
  el.innerHTML=h;el.scrollTop=st;
  if(['loanForm','repForm','personForm'].includes(s.type))setTimeout(()=>el.querySelector('input:not([readonly]):not([type=date]):not([type=checkbox])')?.focus(),250)}

function loanForm(kind){const m=S.me;const isReq=kind==='request';const adm=isAdmin();
  const fixedB=isReq&&!adm,fixedL=!isReq&&!adm;
  const bVal=isReq?m.name:'',lVal=!isReq?m.name:'';
  const fld=(name,label,val,fixed,ph)=>`<div class="fld"><label>${label}</label><input class="inp" name="${name}" ${fixed?'readonly style="background:#F1F0F8"':'list="peopleList"'} required value="${esc(val)}" placeholder="${ph}"></div>`;
  return head(isReq?'طلب سلفة':'تسجيل سلفة')+`<form class="sh-body" data-form="loan" data-kind="${kind}" autocomplete="off">
   <div class="flow">${isReq?`<span>📝 الطلب</span>${IC.arrow}<span>👍 موافقة المُسلِّف</span>${IC.arrow}<span>💰 الصرف</span>`:`<span>💸 التسجيل</span>${IC.arrow}<span>✅ اعتماد المستلف</span>${IC.arrow}<span>سارية</span>`}</div>
   ${isReq?fld('borrower','طالب السلفة (المستلف)',bVal,fixedB,'مثال: أحمد')+fld('lender','مطلوبة من (المُسلِّف)','',false,'مثال: عبدالرحمن')
          :fld('lender','المُسلِّف (من دفع)',lVal,fixedL,'مثال: عبدالرحمن')+fld('borrower','المستلف (من استلم)','',false,'مثال: أحمد')}
   <div class="fld"><label>المبلغ (ر.س)</label><input class="inp amt-inp" name="amount" type="number" inputmode="decimal" min="1" step="any" required placeholder="0">
    <div class="chips-sel">${[500,1000,2000,3000,5000].map(v=>`<button type="button" data-act="amt" data-id="${v}">${money(v)}</button>`).join('')}</div></div>
   <div class="row2"><div class="fld"><label>التاريخ</label><input class="inp" name="date" type="date" value="${today()}" required></div>
   <div class="fld"><label>موعد السداد <small>(اختياري)</small></label><input class="inp" name="due" type="date"></div></div>
   <div class="fld"><label>ملاحظات</label><textarea class="inp" name="notes" placeholder="سبب السلفة، طريقة السداد المتفق عليها…"></textarea></div>
   <div class="hint">اكتب الاسم كما هو مسجّل ليصل للشخص الصحيح. الاسم الجديد يُضاف تلقائياً.</div>
   <button class="btn pri block" type="submit">${isReq?'إرسال الطلب':'تسجيل السلفة'}</button></form>`}

function repForm(loanId){const act=S.loans.filter(l=>l.status==='active'&&(canAct(l.lenderId)||canAct(l.borrowerId))).sort(byNew);
  if(!act.length)return head('سند استرداد')+`<div class="sh-body">${emptyBox('لا توجد سلف سارية','سند الاسترداد يُنشأ على سلفة سارية (مصروفة ومعتمدة).')}</div>`;
  const sel=loanId&&act.some(x=>x.id===loanId)?loanId:act[0].id;const l=loan(sel);
  return head('سند استرداد سلفة')+`<form class="sh-body" data-form="rep" autocomplete="off">
   <div class="fld"><label>السلفة</label><select class="inp" name="loanId" id="repLoan">${act.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(pname(x.borrowerId))} ← ${esc(pname(x.lenderId))} · متبقي ${money(remaining(x))} · ${esc(x.code)}</option>`).join('')}</select></div>
   <div class="fld"><label>المبلغ المُرجَع (ر.س)</label><input class="inp amt-inp" name="amount" id="repAmt" type="number" inputmode="decimal" min="0.01" step="any" required value="${remaining(l)}">
    <div class="chips-sel"><button type="button" data-act="repFull">كامل المتبقي</button><button type="button" data-act="repHalf">النصف</button></div></div>
   <div class="row2"><div class="fld"><label>التاريخ</label><input class="inp" name="date" type="date" value="${today()}" required></div>
   <div class="fld"><label>طريقة السداد</label><select class="inp" name="method"><option>نقداً</option><option>تحويل بنكي</option><option>خصم من الراتب</option><option>STC Pay</option><option>أخرى</option></select></div></div>
   <div class="fld"><label>ملاحظات</label><textarea class="inp" name="notes" placeholder="مثال: دفعة أولى"></textarea></div>
   <div id="repCheck">${repCheckHTML(l)}</div>
   <button class="btn teal block" type="submit">${IC.check} إصدار السند</button></form>`}
function repCheckHTML(l){return canAct(l.lenderId)?`<label class="check"><input type="checkbox" name="received" checked><span>تم استلام المبلغ فعلاً من قِبل <b>${esc(pname(l.lenderId))}</b> (يُؤكَّد السند مباشرة)</span></label>`:`<div class="hint">سيُرسَل السند إلى ${esc(pname(l.lenderId))} لتأكيد الاستلام.</div>`}

function personForm(id){const p=id?person(id):null;const self=p&&p.id===S.me.id;
  return head(p?'تعديل الشخص':'إضافة شخص')+`<form class="sh-body" data-form="person" data-id="${p?p.id:''}" autocomplete="off">
   <div class="fld"><label>الاسم</label><input class="inp" name="name" required value="${esc(p?.name||'')}" placeholder="الاسم كما يظهر في السلف"></div>
   <div class="fld"><label>رقم الجوال <small>(اختياري)</small></label><input class="inp ltr" name="phone" type="tel" inputmode="tel" value="${esc(p?.phone||'')}" placeholder="05xxxxxxxx"></div>
   <div class="fld"><label>ملاحظات</label><textarea class="inp" name="notes">${esc(p?.notes||'')}</textarea></div>
   <div class="sect-t">حساب الدخول</div>
   <div class="hint" style="margin-top:0">${self?'هذا حسابك.':'اتركه فارغاً لو الشخص ما يحتاج يدخل التطبيق (تعتمد عنه أنت).'}</div>
   <div class="row2"><div class="fld"><label>اسم المستخدم</label><input class="inp" dir="auto" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(p?.username||'')}" placeholder="مثال: احمد" ${self?'required':''}></div>
   <div class="fld"><label>الرمز السري</label><input class="inp pin" name="pin" type="password" inputmode="numeric" maxlength="8" placeholder="${p?.has_login?'بدون تغيير':'4-8 أرقام'}" autocomplete="new-password"></div></div>
   <label class="check" style="background:#FFF4DE;color:#8A5A00"><input type="checkbox" name="is_admin" ${p?.is_admin?'checked':''} ${self?'checked disabled':''}><span>صلاحية مدير: يشوف كل السلف ويدير الأشخاص</span></label>
   <button class="btn pri block" type="submit">حفظ</button></form>`}

function shareSheet(s){const t=`أهلاً ${s.name}،\nهذا رابط تطبيق السلف:\n${location.origin}\n\nاسم المستخدم: ${s.username}\nالرمز السري: ${s.pin}`;
  return head('بيانات الدخول')+`<div class="sh-body"><div class="hint" style="margin:0 0 12px">أرسل هذه البيانات للموظف (واتساب مثلاً). لن يظهر الرمز مرة ثانية.</div>
   <div class="sharebox">${esc(t)}</div>
   <div class="foot-acts"><button class="btn pri" data-act="copyText" data-id="${esc(t)}">${IC.copy} نسخ</button>
   <a class="btn green" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">واتساب</a></div></div>`}

function accountSheet(){const m=S.me;
  return head('حسابي')+`<div class="sh-body">
   <div style="display:flex;align-items:center;gap:14px">${avatar(m.name,'lg')}<div><b style="font-size:20px">${esc(m.name)}</b>${m.is_admin?'<span class="role adm">مدير</span>':''}<div style="color:var(--mut)">اسم المستخدم: ${esc(m.username||'')}</div></div></div>
   <form data-form="pin" style="margin-top:18px" autocomplete="off"><div class="sect-t">تغيير الرمز السري</div>
   <div class="row2"><div class="fld"><label>الرمز الحالي</label><input class="inp pin" name="old" type="password" inputmode="numeric" maxlength="8" required autocomplete="current-password"></div>
   <div class="fld"><label>الرمز الجديد</label><input class="inp pin" name="new" type="password" inputmode="numeric" maxlength="8" required autocomplete="new-password"></div></div>
   <button class="btn ghost block" type="submit">تغيير الرمز</button></form>
   <div class="sect-t" style="margin-top:20px">التطبيق على جوالك</div>
   <div class="hint" style="margin-top:0">من المتصفح اختر «إضافة إلى الشاشة الرئيسية» ليصير مثل التطبيق.</div>
   <button class="btn rose block" data-act="logout" style="margin-top:8px">تسجيل الخروج</button></div>`}

function loanSheet(id){const l=loan(id);if(!l)return head('السلفة')+'<div class="sh-body">'+emptyBox('السلفة غير موجودة','ربما حُذفت.')+'</div>';
  const x=ST[l.status]||{t:l.status,c:'gray'};const rp=repaid(l),pct=l.amount?Math.min(100,rp/l.amount*100):0;
  const L=canAct(l.lenderId),B=canAct(l.borrowerId);const a=[];
  if(l.status==='pending_lender'){if(L){a.push(['approve_disburse','موافقة وصرف','pri']);a.push(['approve','موافقة فقط','sky']);a.push(['reject','رفض','rose'])}if(B)a.push(['cancel','إلغاء الطلب','ghost'])}
  if(l.status==='approved'&&L){a.push(['disburse','تم الصرف','pri']);a.push(['reject','إلغاء الموافقة','rose'])}
  if(l.status==='pending_borrower'){if(B){a.push(['accept','اعتماد السلفة','pri']);a.push(['dispute','اعتراض','rose'])}if(L)a.push(['cancel','إلغاء التسجيل','ghost'])}
  if(isAdmin()&&['pending_lender','approved','pending_borrower'].includes(l.status)&&!a.some(z=>z[0]==='cancel'))a.push(['cancel','إلغاء (مدير)','ghost']);
  if(l.status==='active'&&(L||B))a.push(['newRepFor','سند استرداد','teal']);

   ${l.notes?`<div class="notes">📌 ${esc(l.notes)}</div>`:''}

/* ========= dialog & toast ========= */
let dlgRes=null;
function ask({title,msg='',ok='تأكيد',danger=false,input=false,ph=''}){return new Promise(res=>{dlgRes=res;
  $('#dlgB').innerHTML=`<h4>${esc(title)}</h4>${msg?`<p>${esc(msg)}</p>`:''}${input?`<textarea class="inp" id="dlgIn" placeholder="${esc(ph)}" style="margin-bottom:12px"></textarea>`:''}
  <div class="row2"><button class="btn ${danger?'rose':'pri'}" data-act="dlgOk">${esc(ok)}</button><button class="btn ghost" data-act="dlgNo">رجوع</button></div>`;
  $('#dlg').classList.add('open')})}
function dlgClose(v){$('#dlg').classList.remove('open');const r=dlgRes;dlgRes=null;r&&r(v)}
let tt;function toast(m,c=''){const t=$('#toast');t.textContent=m;t.className='toast show '+c;clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2800)}

/* ========= actions ========= */
const busy=new Set();
async function once(key,fn){if(busy.has(key))return;busy.add(key);try{await fn()}finally{busy.delete(key)}}
async function loanOp(op,id){const l=loan(id);if(!l)return;const nm=pname(l.borrowerId);let note='';
  if(op==='newRepFor')return openSheet({type:'repForm',loanId:id});
  if(op==='approve_disburse'&&!await ask({title:'موافقة وصرف',msg:`سيتم صرف ${money(l.amount)} ر.س إلى ${nm} وتصبح السلفة سارية.`,ok:'موافقة وصرف'}))return;
  if(op==='disburse'&&!await ask({title:'تأكيد الصرف',msg:`هل تم تسليم ${money(l.amount)} ر.س إلى ${nm}؟`,ok:'نعم، تم الصرف'}))return;
  if(op==='accept'&&!await ask({title:'اعتماد السلفة',msg:`أؤكد أني استلمت ${money(l.amount)} ر.س من ${pname(l.lenderId)}.`,ok:'اعتماد'}))return;
  if(op==='reject'||op==='dispute'){const n=await ask({title:op==='dispute'?'اعتراض على السلفة':'رفض',msg:'اكتب السبب (اختياري)',ok:op==='dispute'?'إرسال الاعتراض':'رفض',danger:true,input:true,ph:'السبب…'});if(!n)return;note=n===true?'':n}
  if(op==='cancel'&&!await ask({title:'إلغاء',msg:'هل تريد إلغاء هذه العملية؟',ok:'إلغاء العملية',danger:true}))return;
  const msgs={approve_disburse:'تمت الموافقة وصرف السلفة 💰',approve:'تمت الموافقة',disburse:'تم صرف السلفة 💰',accept:'تم اعتماد السلفة ✅',reject:'تم الرفض',dispute:'تم إرسال الاعتراض',cancel:'تم الإلغاء'};
  await act('slf_loan_op',{p_loan:id,p_op:op,p_note:note},msgs[op])}
async function confirmRep(rid){const r=rep(rid),l=r&&loan(r.loanId);if(!r||!l)return;
  if(!await ask({title:'تأكيد الاستلام',msg:`هل استلم ${pname(l.lenderId)} مبلغ ${money(r.amount)} ر.س من ${pname(l.borrowerId)}؟`,ok:'نعم، تم الاستلام'}))return;
  const closing=remaining(l)-r.amount<=0.001;
  await act('slf_rep_op',{p_rep:rid,p_op:'confirm',p_note:''},closing?'سُددت السلفة بالكامل 🎉':'تم تأكيد الاستلام')}
async function rejectRep(rid){const n=await ask({title:'رفض السند',msg:'اكتب السبب (اختياري)',ok:'رفض',danger:true,input:true});if(!n)return;
  await act('slf_rep_op',{p_rep:rid,p_op:'reject',p_note:n===true?'':n},'تم رفض السند')}

async function submitLoan(f){const fd=new FormData(f);const kind=f.dataset.kind;
  const bn=String(fd.get('borrower')||'').trim(),ln=String(fd.get('lender')||'').trim(),amt=+fd.get('amount');
  if(!bn||!ln)return toast('اكتب الاسمين','err');if(bn===ln)return toast(ERR.SAME_PERSON,'err');if(!(amt>0))return toast(ERR.BAD_AMOUNT,'err');
  const ok=await act('slf_create_loan',{p_kind:kind,p_borrower:bn,p_lender:ln,p_amount:amt,p_date:fd.get('date')||null,p_due:fd.get('due')||null,p_notes:String(fd.get('notes')||'').trim()},
    kind==='request'?`أُرسل الطلب إلى ${ln}`:`سُجّلت السلفة وبانتظار اعتماد ${bn}`);
  if(ok){closeSheet();S.tab='loans';S.lf='pending';render()}}
async function submitRep(f){const fd=new FormData(f);const l=loan(fd.get('loanId'));const amt=+fd.get('amount');
  if(!l||l.status!=='active')return toast(ERR.NOT_ACTIVE,'err');if(!(amt>0))return toast(ERR.BAD_AMOUNT,'err');
  if(amt>remaining(l)+0.001)return toast(`المبلغ أكبر من المتبقي (${money(remaining(l))})`,'err');
  if(amt>remaining(l)-pendingRepSum(l)+0.001&&!await ask({title:'تنبيه',msg:'يوجد سندات أخرى بانتظار التأكيد، والمبلغ يتجاوز المتبقي بعد احتسابها. متابعة؟',ok:'متابعة'}))return;
  const conf=canAct(l.lenderId)&&!!fd.get('received');const closing=conf&&remaining(l)-amt<=0.001;
  const ok=await act('slf_add_rep',{p_loan:l.id,p_amount:amt,p_date:fd.get('date')||null,p_method:fd.get('method')||'',p_notes:String(fd.get('notes')||'').trim(),p_received:conf},
    closing?'سُددت السلفة بالكامل 🎉':conf?'تم إصدار السند وتأكيده':`أُرسل السند إلى ${pname(l.lenderId)} للتأكيد`);
  if(ok){closeSheet();S.tab='reps';render()}}
async function submitPerson(f){const fd=new FormData(f);const id=f.dataset.id||null;const p=id?person(id):null;
  const name=String(fd.get('name')||'').trim(),username=normUser(fd.get('username')),pin=normPin(fd.get('pin'));
  if(username&&!USER_RE.test(username))return toast(ERR.BAD_USERNAME,'err');
  if(pin&&!/^[0-9]{4,8}$/.test(pin))return toast(ERR.BAD_PIN,'err');
  if(username&&!pin&&!p?.has_login)return toast(ERR.PIN_REQUIRED,'err');
  const isAdm=(p&&p.id===S.me.id)?true:!!fd.get('is_admin');
  const ok=await act('slf_save_person',{p_id:id,p_name:name,p_phone:String(fd.get('phone')||'').trim(),p_notes:String(fd.get('notes')||'').trim(),p_username:username,p_pin:pin,p_is_admin:isAdm},'تم الحفظ');
  if(!ok)return;
  if(username&&pin)openSheet({type:'share',name,username,pin});
  else if(id)openSheet({type:'person',id});else{closeSheet();S.tab='people';render()}}
async function submitAuth(f){const fd=new FormData(f);const setup=f.dataset.form==='setup';
  const u=normUser(fd.get('username')),pin=normPin(fd.get('pin'));
  if(!USER_RE.test(u))return toast(ERR.BAD_USERNAME,'err');if(!/^[0-9]{4,8}$/.test(pin))return toast(ERR.BAD_PIN,'err');
  if(setup&&pin!==normPin(fd.get('pin2')))return toast('الرمزان غير متطابقين','err');
  try{const r=setup?await rpc('slf_setup',{p_name:String(fd.get('name')||'').trim(),p_username:u,p_pin:pin}):await rpc('slf_login',{p_username:u,p_pin:pin});
    if(!r||!r.token)return toast(errMsg({code:r&&r.error}),'err');
    S.token=r.token;lsSet('slf_token',r.token);lsSet('slf_user',u);S.view='app';S.tab='home';await load()}
  catch(e){toast(errMsg(e),'err');if(e.code==='ALREADY_SETUP'){S.view='login';render()}}}
async function submitPin(f){const fd=new FormData(f);const nw=normPin(fd.get('new'));if(!/^[0-9]{4,8}$/.test(nw))return toast(ERR.BAD_PIN,'err');
  if(await act('slf_change_pin',{p_old:String(fd.get('old')||''),p_new:nw},'تم تغيير الرمز'))f.reset()}

  tab:id=>{S.tab=id;closeSheet();render();window.scrollTo({top:0,behavior:'smooth'})},

    try{await rpc('slf_logout',{p_token:T()})}catch(e){}S.token=null;lsSet('slf_token',null);S.me=null;S.loaded=false;closeSheet();S.view='login';render()},
  newRequest:()=>openSheet({type:'loanForm',kind:'request'}),

  repFull:()=>{const l=loan($('#repLoan').value);$('#repAmt').value=remaining(l)},

  delLoan:id=>once('l'+id,async()=>{if(!await ask({title:'حذف السلفة',msg:'ستُحذف السلفة وكل سنداتها وسجلها نهائياً.',ok:'حذف نهائي',danger:true}))return;
    if(await act('slf_loan_op',{p_loan:id,p_op:'delete',p_note:''},'تم الحذف'))closeSheet()}),
  copyText:async t=>{try{await navigator.clipboard.writeText(t);toast('تم النسخ','ok')}catch(e){toast('تعذّر النسخ','err')}},
  copyV:async v=>{const[k,id]=v.split(':');let t='';
    if(k==='rep'){const r=rep(id),l=loan(r.loanId);t=`سند استرداد سلفة\nرقم: ${r.code}\nالتاريخ: ${fdate(r.date)}\nاستلمنا من: ${pname(l.borrowerId)}\nالمستلم: ${pname(l.lenderId)}\nالمبلغ: ${money(r.amount)} ر.س\nطريقة السداد: ${r.method||'-'}\nعن سلفة: ${l.code}\nالمتبقي: ${money(remaining(l))} ر.س\nالحالة: ${RST[r.status]?.t||''}${r.notes?'\nملاحظات: '+r.notes:''}`}
    else{const l=loan(id);t=`سند صرف سلفة\nرقم: ${l.code}\nالتاريخ: ${fdate(l.disbursedAt||l.date)}\nصُرفت إلى: ${pname(l.borrowerId)}\nمن: ${pname(l.lenderId)}\nالمبلغ: ${money(l.amount)} ر.س\nموعد السداد: ${fdate(l.due)}\nالمسدد: ${money(repaid(l))} ر.س\nالمتبقي: ${money(remaining(l))} ر.س${l.notes?'\nملاحظات: '+l.notes:''}`}
    H.copyText(t)},
  dlgOk:()=>{const i=$('#dlgIn');dlgClose(i?(i.value.trim()||true):true)},
  dlgNo:()=>dlgClose(false)
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='sheetWrap')closeSheet();if(e.target.id==='dlg')dlgClose(false);return}
  const f=H[t.dataset.act];if(f){e.stopPropagation();f(t.dataset.id,t,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  const run={loan:submitLoan,rep:submitRep,person:submitPerson,login:submitAuth,setup:submitAuth,pin:submitPin}[f.dataset.form];
  if(run){const b=f.querySelector('button[type=submit],button:not([type])');if(b)b.disabled=true;Promise.resolve(run(f)).finally(()=>{if(b)b.disabled=false})}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#loanList').innerHTML=loansListHTML()}});
document.addEventListener('change',e=>{if(e.target.id==='repLoan'){const l=loan(e.target.value);$('#repAmt').value=remaining(l);$('#repCheck').innerHTML=repCheckHTML(l)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlg').classList.contains('open'))dlgClose(false);else closeSheet()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='app')load(true)});
setInterval(()=>{if(S.view==='app'&&!document.hidden)load(true)},20000);
setInterval(()=>{if(S.view==='app')updRefresh()},30000);

/* ========= boot ========= */
(async function boot(){render();
  if(S.token){S.view='app';render();await load();if(S.view==='app'&&!S.loaded&&S.netErr)return;if(S.view!=='app')return;return}
  try{const st=await rpc('slf_status');S.view=st&&st.has_admin?'login':'setup'}catch(e){S.view='login';toast(errMsg(e),'err')}
  render()})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
